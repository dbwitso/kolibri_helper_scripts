[pytest]
addopts = -p no:warnings -p no:cacheprovider
# pytest-django: Kolibri's test settings
django_find_project = false
DJANGO_SETTINGS_MODULE = kolibri.deployment.default.settings.test
# pytest-env: a throwaway Kolibri home (created and removed by Kolibri's
# conftest fixtures, imported in conftest.py)
env =
    KOLIBRI_HOME=./.pytest_kolibri_home
